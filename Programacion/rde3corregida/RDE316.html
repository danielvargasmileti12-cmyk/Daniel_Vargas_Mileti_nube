<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Document</title>
</head>

<body>
   <script>
      let salarioUsuario = Number(prompt("Introduzca aqui su salario"))
      let impuesto

      if (salarioUsuario < 10000) {
         impuesto = 0

      } else if (salarioUsuario <= 20000) {
         impuesto = salarioUsuario * 0.10

      } else if (salarioUsuario <= 40000) {
         impuesto = salarioUsuario * 0.20

      } else {
         impuesto = salarioUsuario * 0.30
      }
      console.log(
         "El impuesto a pagar es de " + " " + impuesto + " " + " euros"
      );

   </script>
</body>

</html>
