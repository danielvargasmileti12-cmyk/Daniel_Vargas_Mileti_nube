<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let numeroUsuario = Number(prompt("Introduzca aqui el numero"))

        if (numeroUsuario >= 10 && numeroUsuario <= 20) {
            console.log(
                numeroUsuario + " " + "esta en el rango de 10 a 20"
            );

        } else {
            console.log(
                numeroUsuario + " " + "no esta en el rango de 10 a 20"
            );

        }
    </script>
</body>

</html>
