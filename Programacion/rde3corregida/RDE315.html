<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let valorAngulo = Number(prompt("Introduzca aqui el valor de su angulo"))

        if (valorAngulo < 90) {
            console.log(
                "El angulo es agudo"
            );

        } else if (valorAngulo === 90) {
            console.log(
                "El angulo es recto"
            );

        } else if (valorAngulo < 180) {
            console.log(
                "El angulo es obtuso"
            );

        } else if (valorAngulo === 180) {
            console.log(
                "El angulo es llano"
            );

        } else {
            console.log(
                "El angulo no es valido"
            );

        }
    </script>
</body>

</html>
