<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let numeroUsuario = Number(prompt("Introduzca aqui un numero de dos cifras"))

        if ((numeroUsuario >= -10 && numeroUsuario <= 10) &&
            (numeroUsuario >= -99 || numeroUsuario <= 99)) {

            let primeraCifra = parseInt(numeroUsuario / 10)
            if (primeraCifra < 0) {
                //primeraCifra = primeraCifra * -1
                //Es lo mismo la operacion de arriba que la de abajo
                primeraCifra *= -1
            }

            let segundaCifra = numeroUsuario % 10
            if (segundaCifra < 0) {
                segundaCifra *= -1
            }


            let suma = primeraCifra + segundaCifra
            console.log(
                "La suma de los dos digitos es de :" + " " + suma
            );



        } else {
            console.log(
                "El numero no tiene dos cifras"
            );

        }


    </script>
</body>

</html>
