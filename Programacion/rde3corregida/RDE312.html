<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let lado_1 = Number(prompt("Introduzca el primer lado"))
        let lado_2 = Number(prompt("Introduzca el segundo lado"))
        let lado_3 = Number(prompt("Introduzca el tercer lado"))

         
        
        if (lado_1 === lado_2 && lado_2 === lado_3) {
            console.log(
                "El triangulo es equilatero"
            );

         } else if (lado_1 === lado_2 || lado_2 === lado_3) {
            console.log(
                "El triangulo es isosceles"
            );

         } else {
            console.log(
                "El triangulo es escaleno"
            );

         }
    </script>
</body>

</html>
