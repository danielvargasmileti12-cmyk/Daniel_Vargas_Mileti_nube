<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
         let numeroUsuario = Number(prompt("Introduzca aqui su numero"))

         if (numeroUsuario > 0) {
            console.log(
                numeroUsuario + " " + "es positivo"
            );

         } else if (numeroUsuario < 0) {
            console.log(
                numeroUsuario + " " + "es negativo"
            );
         } else {
            console.log(
                numeroUsuario + " " + " es cero"
            );
         }



    </script>
</body>

</html>
