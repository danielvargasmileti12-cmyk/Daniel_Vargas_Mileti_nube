<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let creditoUsuario = Number(prompt("Introduzca la puntuacion de su credito"))
        let tiempoUsuario = Number(prompt("Introduzca aqui cuanto tiempo lleva con nostros en años"))

        if (creditoUsuario > 650 && tiempoUsuario > 5) {
            console.log(
                "A usted se le aprueba un credito premium"
            );

        } else if (creditoUsuario > 650 && tiempoUsuario >= 2 && tiempoUsuario <= 5) {
            console.log(
                "A usted se le aprueba un credito estandar"
            );

        } else {
            console.log(
                "A usted se le a rechazado el credito"
            );
        }
    </script>


</body>

</html>
