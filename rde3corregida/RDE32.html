<head>

<body>
    <script>
        let numeroUsuario = Number(prompt("Introduzca aqui un numero"))
        if (numeroUsuario % 2 === 0) {
            console.log(
                numeroUsuario + " " + "es PAR"
            );
        } else {
            console.log(
                numeroUsuario + " " + "es IMPAR"
            );
        }
    </script>
</body>
