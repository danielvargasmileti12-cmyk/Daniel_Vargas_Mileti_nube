<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let numero = Number(prompt("Introduzca aqui su numero"))

        if (numero % 5 === 0) {
            console.log(
                "Su numero si es multiplo de 5"
            );

        } else {
            console.log(
                "Su numero no es multiplo de 5"
            );

        }
    </script>
</body>

</html>
