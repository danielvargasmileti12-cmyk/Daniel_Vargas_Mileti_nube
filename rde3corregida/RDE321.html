<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let pesoUsuario = Number(prompt("Introduzca aqui su peso en kg"))
        let alturaUsuario = Number(prompt("Introduzca aqui su altura en m"))

        let imc = pesoUsuario / (alturaUsuario * alturaUsuario)

        if (imc < 18.5){
            console.log(
                "Su IMC es de :" + " " + imc + " " + "asi que tendra un bajo peso" 
            );
            
        }else if (imc < 25){
            console.log(
                "Su IMC es de :" + " " + imc + " " + "asi que tendra un peso normal"
            );
            
        }else if (imc < 30){
            console.log(
                "Su imc es de:" + " " + imc + " " + "asi que sera tendra sobrepeso"
            );
            
        }else{
            console.log(
                "Su imc es de:" + " " + imc + " " + "asi que tendra obesidad"
            );
            
        }
        
    </script>
</body>
</html>
