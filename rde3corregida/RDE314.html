<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let climaUsuario = Number(prompt("Introduzca aqui la temperatura actual"))

        if (climaUsuario < 0) {
            console.log(
                "El clima es muy frio"
            );

        } else if (climaUsuario < 15) {
            console.log(
                "El clima es frio"
            );

        } else if (climaUsuario < 25) {
            console.log(
                "El clima es templado"
            );

        } else if (climaUsuario > 25) {
            console.log(
                "El clima es caliente"
            );

        }
    </script>
</body>

</html>
